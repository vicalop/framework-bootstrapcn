<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · Acme</title>
  <link rel="stylesheet" href="../dist/css/bootstrap-shadcn.min.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-4">
      <span class="brand-mark mx-auto mb-3" style="width:2.5rem;height:2.5rem;font-size:1.25rem"><svg class="bootcn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span>
      <h1 class="h4 mb-1" style="letter-spacing:-0.02em">Create your account</h1>
      <p class="page-sub">Start your 14-day free trial. No card required.</p>
    </div>
    <div class="card">
      <div class="card-body p-4">
        <form onsubmit="location.href='dashboard.html';return false">
          <div class="mb-3">
            <label class="form-label" for="s-name">Name</label>
            <input class="form-control" id="s-name" placeholder="Sofia Chen" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="s-email">Email</label>
            <input class="form-control" id="s-email" type="email" placeholder="you@acme.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="s-pass">Password</label>
            <input class="form-control" id="s-pass" type="password" placeholder="At least 8 characters" required>
            <div class="form-text">Use 8 or more characters with a mix of letters and numbers.</div>
          </div>
          <button class="btn btn-primary w-100" type="submit">Create account</button>
        </form>
        <div class="auth-divider my-3">or</div>
        <button class="btn btn-outline-secondary w-100"><svg class="bootcn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 4 5 4 5 4c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 11c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>&nbsp;Sign up with GitHub</button>
      </div>
    </div>
    <p class="text-center page-sub mt-3">
      Already have an account? <a href="login.html">Sign in</a>
    </p>
  </div>
</div>
<script src="../dist/js/bootstrap.bundle.min.js"></script>
<script src="demo.js"></script>
</body>
</html>
