name: Release to jsDelivr (GitHub CDN)

# Push a version tag (e.g. `v0.1.1`) to publish that version to jsDelivr's
# GitHub route:
#
#   https://cdn.jsdelivr.net/gh/<owner>/<repo>@v0.1.1/dist/...
#
# jsDelivr serves files exactly as committed at the tag, and does NOT run your
# build. `dist/` is gitignored on `main`, so this workflow builds it and attaches
# it to the tag: it re-points the freshly pushed tag at a commit that contains
# `dist/`. `main` history stays clean (the build commit is only reachable via the
# tag). The tag is moved once, immediately after you push it and before anything
# fetches it, so jsDelivr never sees a version without `dist/`.
#
# Release flow:
#   1. Bump "version" in package.json on main and push it.
#   2. git tag v<version> && git push origin v<version>
#
# Requirements: the repository must be PUBLIC for the jsDelivr /gh route to work.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version ($PKG). Bump package.json to match the tag, then re-tag."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Attach dist to the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist
          git commit -m "Build dist for ${GITHUB_REF_NAME}"
          # Re-point the just-pushed tag at the build commit so jsDelivr serves dist/.
          git tag -f -a "${GITHUB_REF_NAME}" -m "Release ${GITHUB_REF_NAME}"
          git push -f origin "${GITHUB_REF_NAME}"

      - name: Purge jsDelivr @latest cache
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          FILES=(
            dist/css/bootstrap-shadcn.min.css
            dist/js/bootstrap.bundle.min.js
            dist/js/bootcn.min.js
          )

          purge_latest() {
            local ok=1
            for file in "${FILES[@]}"; do
              echo "Purging gh/${REPO}@latest/${file}"
              resp=$(curl -fsS "https://purge.jsdelivr.net/gh/${REPO}@latest/${file}")
              echo "$resp"
              if ! echo "$resp" | grep -q '"status":"finished"'; then
                ok=0
              fi
            done
            [ "$ok" -eq 1 ]
          }

          verify_latest() {
            headers=$(curl -fsSI "https://cdn.jsdelivr.net/gh/${REPO}@latest/dist/css/bootstrap-shadcn.min.css")
            ver=$(printf '%s\n' "$headers" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-jsd-version" {print $2; exit}')
            echo "CDN x-jsd-version: ${ver:-unknown} (expect ${VERSION})"
            [ "${ver}" = "${VERSION}" ]
          }

          # jsDelivr may briefly cache the release index; pause before the first purge.
          echo "Waiting 30s for jsDelivr to index ${TAG}..."
          sleep 30

          for attempt in 1 2 3; do
            echo "Purge attempt ${attempt}/3"
            purge_latest || true
            sleep 10
            if verify_latest; then
              echo "Purge verified — @latest serves ${TAG}"
              exit 0
            fi
            echo "Verification failed; retrying in 60s..."
            sleep 60
          done

          echo "::warning::Could not verify @latest purge. CDN may take up to ~12h to refresh."

      - name: Publish summary
        run: |
          REPO="${{ github.repository }}"
          {
            echo "### Published ${GITHUB_REF_NAME} to jsDelivr"
            echo ""
            echo "The release workflow purged \`@latest\` via \`purge.jsdelivr.net\` so projects update immediately (browser caches may still lag up to ~7 days)."
            echo ""
            echo "**CDN (auto-updating):**"
            echo ""
            echo '```html'
            echo "<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/${REPO}@latest/dist/css/bootstrap-shadcn.min.css\">"
            echo "<script src=\"https://cdn.jsdelivr.net/gh/${REPO}@latest/dist/js/bootstrap.bundle.min.js\"></script>"
            echo "<script src=\"https://cdn.jsdelivr.net/gh/${REPO}@latest/dist/js/bootcn.min.js\"></script>"
            echo '```'
            echo ""
            echo "**Pinned (this release):**"
            echo ""
            echo '```html'
            echo "<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/${REPO}@${GITHUB_REF_NAME}/dist/css/bootstrap-shadcn.min.css\">"
            echo "<script src=\"https://cdn.jsdelivr.net/gh/${REPO}@${GITHUB_REF_NAME}/dist/js/bootstrap.bundle.min.js\"></script>"
            echo "<script src=\"https://cdn.jsdelivr.net/gh/${REPO}@${GITHUB_REF_NAME}/dist/js/bootcn.min.js\"></script>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
